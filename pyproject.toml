[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketnormalizationengine"
version = "0.1.0"
description = "Market data normalization engine for Dukascopy forex tick data."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "Marlon Dominguez", email = "marlon.dominguez307@gmail.com"}
]
dependencies = [
  "pandas",
  "requests",
  "tqdm",
  "pyarrow"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marketnormalizationengine*"]

[project.scripts]
dukascopy-engine = "marketnormalizationengine.dukascopy.data_engine:main"
